name: expence-ci

on:
    push:
        branches: [main]

env:
    PYTHON-VERSION: 3.10

jobs:
    backend-test:
        name: backend test first
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v5
            
            - name: setup python
              uses: actions/setup-python@v5
            
            - name: install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            
            - name: run tests
              run: pytest